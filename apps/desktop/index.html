<!doctype html>
<html lang="tr" class="dark" data-accent="green" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Sıkı Content Security Policy: uzak kaynak yüklenmez, eval kullanılmaz.
      'unsafe-inline' yalnızca stil için gereklidir (Tailwind runtime yok, ancak
      React inline style kullanır). Ses/görsel için blob: ve data: izinlidir.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: uryx-media: https:; media-src 'self' data: blob: uryx-media: https:; font-src 'self' data:; connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:* http://localhost:* ws://localhost:*; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Uryx</title>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
